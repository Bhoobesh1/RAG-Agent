<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Chatbot</title>

<style>
:root{
    --bg-main:#0b1020;
    --bg-chat:#111827;
    --bg-user:#2563eb;
    --bg-bot:#1f2937;
    --border:#334155;
    --text-main:#e5e7eb;
    --text-muted:#9ca3af;
    --accent:#3b82f6;
}

*{ box-sizing:border-box; }

body{
    margin:0;
    font-family: "Inter", "Segoe UI", sans-serif;
    background: radial-gradient(circle at top, #111827, var(--bg-main));
    color:var(--text-main);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.app{
    width:100%;
    max-width:900px;
    height:90vh;
    background:var(--bg-chat);
    border:1px solid var(--border);
    border-radius:16px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

/* -------- HEADER -------- */
.header{
    padding:18px 22px;
    border-bottom:1px solid var(--border);
    font-size:20px;
    font-weight:700;
}

/* -------- UPLOAD -------- */
.upload{
    padding:16px 22px;
    border-bottom:1px solid var(--border);
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.upload span{
    color:var(--text-muted);
    font-size:14px;
}

.upload label{
    background:var(--accent);
    color:white;
    padding:8px 16px;
    border-radius:8px;
    cursor:pointer;
    font-weight:600;
}

/* -------- CHAT -------- */
.chat{
    flex:1;
    padding:20px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:14px;
}

/* -------- MESSAGE BUBBLES -------- */
.msg{
    max-width:75%;
    padding:12px 16px;
    border-radius:14px;
    font-size:15px;
    line-height:1.5;
    animation:fadeIn 0.3s ease;
}

.user{
    align-self:flex-end;
    background:var(--bg-user);
    border-bottom-right-radius:4px;
}

.bot{
    align-self:flex-start;
    background:var(--bg-bot);
    border-bottom-left-radius:4px;
    color:#d1fae5;
}

/* -------- INPUT -------- */
.input-bar{
    border-top:1px solid var(--border);
    padding:14px;
    display:flex;
    gap:12px;
}

.input-bar input{
    flex:1;
    padding:14px;
    border-radius:12px;
    border:1px solid var(--border);
    background:#020617;
    color:white;
    font-size:15px;
}

.input-bar input:focus{
    outline:none;
    border-color:var(--accent);
}

.send-btn{
    background:var(--accent);
    border:none;
    color:white;
    padding:0 22px;
    border-radius:12px;
    font-weight:700;
    cursor:pointer;
}

/* -------- ANIMATION -------- */
@keyframes fadeIn{
    from{opacity:0; transform:translateY(6px);}
    to{opacity:1; transform:translateY(0);}
}
</style>
</head>

<body>

<div class="app">

    <!-- Header -->
    <div class="header">📄 PDF Chatbot</div>

    <!-- Upload -->
    <div class="upload">
        <span id="fileInfo">No PDF uploaded</span>
        <label>
            Upload PDF
            <input type="file" accept=".pdf" hidden>
        </label>
    </div>

    <!-- Chat -->
    <div class="chat" id="chatBox">
        <div class="msg bot">
            Hello 👋 Upload a PDF and ask me anything about it.
        </div>
    </div>

    <!-- Input -->
    <div class="input-bar">
        <input type="text" id="question" placeholder="Type your question and press Enter…" disabled>
        <button class="send-btn">Send</button>
    </div>

</div>

<script>
let pdfUploaded = false;
const chatBox = document.getElementById("chatBox");
const input = document.getElementById("question");

/* -------- Upload -------- */
document.querySelector('input[type="file"]').addEventListener("change", async function(){
    const file = this.files[0];
    if(!file) return;

    document.getElementById("fileInfo").innerText = "Processing PDF...";

    const formData = new FormData();
    formData.append("pdf", file);

    const res = await fetch("/upload", { method:"POST", body:formData });
    const data = await res.json();

    document.getElementById("fileInfo").innerText = file.name;
    chatBox.innerHTML += `<div class="msg bot">${data.message}</div>`;
    input.disabled = false;
    pdfUploaded = true;
});

/* -------- Send Question -------- */
async function sendMessage(){
    const text = input.value.trim();
    if(!text || !pdfUploaded) return;

    chatBox.innerHTML += `<div class="msg user">${text}</div>`;
    input.value = "";
    chatBox.scrollTop = chatBox.scrollHeight;

    const res = await fetch("/ask",{
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body:JSON.stringify({ question:text })
    });

    const data = await res.json();
    chatBox.innerHTML += `<div class="msg bot">${data.answer}</div>`;
    chatBox.scrollTop = chatBox.scrollHeight;
}

input.addEventListener("keydown", e => e.key === "Enter" && sendMessage());
document.querySelector(".send-btn").onclick = sendMessage;
</script>

</body>
</html>
